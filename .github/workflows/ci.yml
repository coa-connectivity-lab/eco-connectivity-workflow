name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff nbclient jupyter

      - name: Lint
        run: ruff check .

      - name: Execute the demo notebook
        run: jupyter nbconvert --to notebook --execute --inplace demo.ipynb

      - name: Validate metadata
        run: |
          python -m json.tool codemeta.json > /dev/null
          python -c "import yaml; yaml.safe_load(open('CITATION.cff'))"
